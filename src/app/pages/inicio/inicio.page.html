<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Inicio</ion-title>
    <!-- Botón de Modo Oscuro / Claro en la cabecera -->
    <ion-buttons slot="end">
      <ion-button (click)="toggleDarkMode()">
        <ion-icon slot="icon-only" [name]="isDarkMode ? 'sun-outline' : 'moon-outline'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>DAM2 - API REST</h1>

  <p>
    Aplicación Ionic + Angular Standalone
    para consumir una API REST.
  </p>

  <!-- Botón de Productos -->
  <ion-button color="primary" routerLink="/productos">
    Ver productos
  </ion-button>

  <!-- Botón de Tareas (TODOs) -->
  <ion-button color="secondary" routerLink="/todos">
    Ver tareas
  </ion-button>
</ion-content>
